<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星叶测试组 — 开发者与测试组</title>
<style>
  :root {
    --paper: #f3ede1;
    --ink: #16130e;
    --ink-soft: #4a4237;
    --muted: #8a7f6e;
    --line: rgba(22, 19, 14, 0.16);
    --line-soft: rgba(22, 19, 14, 0.08);
    --red: #a8342a;
    --wash: rgba(74, 56, 30, 0.07);
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Georgia", serif;
    --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace;
  }

  body.ink-mode {
    --paper: #14120e;
    --ink: #efe7d6;
    --ink-soft: #cbc1ae;
    --muted: #8d8371;
    --line: rgba(239, 231, 214, 0.2);
    --line-soft: rgba(239, 231, 214, 0.1);
    --red: #d2604f;
    --wash: rgba(239, 231, 214, 0.07);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background .5s ease, color .5s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .55;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23p)' opacity='.16'/%3E%3C/svg%3E");
  }
  body.ink-mode::before { opacity: .3; mix-blend-mode: screen; }

  ::selection { background: var(--red); color: var(--paper); }

  /* 墨迹画布 */
  #ink {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 页眉 */
  .masthead {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 13px clamp(22px, 5vw, 84px);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .mh-left { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  .mh-brand { font-family: var(--serif); font-size: 15px; letter-spacing: .18em; white-space: nowrap; }
  .mh-kind, .mh-right {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .mh-right { display: flex; align-items: center; gap: 14px; }
  .mh-sec { display: inline-block; min-width: 3.2em; color: var(--muted); }
  .mh-sec.flip { animation: secFlip .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes secFlip { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .mh-page { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .theme-btn {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    padding: 6px 10px;
    cursor: pointer;
    transition: color .3s, border-color .3s;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--ink); }

  .sheet {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(22px, 5vw, 84px);
  }

  .reg { position: absolute; width: 13px; height: 13px; pointer-events: none; opacity: .45; }
  .reg::before, .reg::after { content: ""; position: absolute; background: var(--ink); }
  .reg::before { left: 50%; top: 0; width: 1px; height: 100%; }
  .reg::after { top: 50%; left: 0; height: 1px; width: 100%; }
  .reg.tl { left: 14px; top: 70px; }
  .reg.tr { right: 14px; top: 70px; }
  .reg.bl { left: 14px; bottom: 14px; }
  .reg.br { right: 14px; bottom: 14px; }

  .grid {
    display: grid;
    grid-template-columns: 108px minmax(0, 1fr);
    gap: 0 clamp(20px, 3vw, 44px);
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
  }

  .rail { border-right: 1px solid var(--line-soft); }
  .rail-inner {
    position: sticky;
    top: 88px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    padding: 8px 12px 0 0;
  }
  .rail a {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    color: var(--ink-soft);
    opacity: .72;
    text-decoration: none;
    transition: color .3s, opacity .3s, transform .3s;
  }
  .rail a em {
    font-style: normal;
    color: var(--muted);
    opacity: .55;
    font-variant-numeric: tabular-nums;
    min-width: 16px;
  }
  .rail a:hover { color: var(--ink); opacity: 1; }
  .rail a.is-current { color: var(--red); opacity: 1; transform: translateX(-3px); }
  .rail a.is-current em { color: var(--red); opacity: 1; }
  .rail-tick {
    position: absolute;
    right: 0;
    top: 0;
    width: 14px;
    height: 1px;
    background: var(--red);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .rail-line {
    position: absolute;
    right: -1px;
    top: 0;
    width: 1px;
    height: 100%;
    background: var(--red);
    transform-origin: top;
    transform: scaleY(0);
    opacity: .5;
  }

  /* 封面 */
  .hero { position: relative; padding: clamp(38px, 6vh, 66px) 0 clamp(26px, 4.4vh, 46px); }

  .kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(22px, 3.6vh, 36px);
  }
  .kicker::before { content: ""; width: 32px; height: 1px; background: var(--red); }

  .title {
    position: relative;
    padding-left: clamp(14px, 2vw, 26px);
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(46px, 8.4vw, 118px);
    line-height: 1.02;
    letter-spacing: .01em;
  }
  .title::before {
    content: "";
    position: absolute;
    left: 0; top: 2px; bottom: 6px;
    width: 2px;
    background: var(--red);
    transform-origin: top;
    animation: lineDraw .8s cubic-bezier(.2,.8,.2,1) .1s backwards;
  }
  @keyframes lineDraw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .title .line { display: block; overflow: hidden; padding-bottom: .05em; }
  .title .ch {
    display: inline-block;
    font-style: normal;
    transform: translateY(112%) rotate(2deg);
    animation: charRise 1.05s cubic-bezier(.16,.9,.2,1) forwards;
    animation-delay: calc(var(--i, 0) * 70ms + 120ms);
  }
  @keyframes charRise {
    60% { transform: translateY(-3%) rotate(-.6deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  .hero-foot {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    gap: 26px;
    margin-top: clamp(26px, 4vh, 42px);
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .hero-stats {
    display: flex;
    gap: clamp(18px, 3vw, 40px);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero-stats > div { padding-top: 10px; border-top: 1px solid var(--ink); min-width: 54px; }
  .hero-stats b {
    display: block;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* 名条 */
  .band {
    position: relative;
    z-index: 1;
    margin: clamp(18px, 3vh, 32px) 0 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 11px 0;
    overflow: hidden;
    -webkit-mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .band-track { display: flex; width: max-content; animation: bandSlide 30s linear infinite; }
  .band:hover .band-track { animation-play-state: paused; }
  .band-track span {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding-right: 26px;
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: .18em;
    color: var(--ink-soft);
    white-space: nowrap;
    transition: color .3s;
  }
  .band-track span::after { content: ""; width: 4px; height: 4px; background: var(--red); opacity: .55; }
  .band-track span:hover { color: var(--red); }
  @keyframes bandSlide { to { transform: translateX(-50%); } }

  /* 区块 */
  .sec { position: relative; padding: clamp(42px, 7vh, 76px) 0 0; }

  .sec-head {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
  }
  .sec-head::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .95s cubic-bezier(.2,.8,.2,1) .1s;
  }
  .sec-head.in::after { transform: scaleX(1); }
  .sec-no {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .2em;
    color: var(--red);
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity .6s ease .1s, transform .6s cubic-bezier(.2,.8,.2,1) .1s;
  }
  .sec-head.in .sec-no { opacity: 1; transform: none; }
  .sec-head h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(20px, 2.2vw, 26px);
    font-weight: 700;
    letter-spacing: .18em;
  }
  .sec-head .en {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* 作者 */
  .author {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 24px;
    padding: clamp(20px, 3.4vh, 32px) 0 clamp(24px, 4vh, 38px);
    border-bottom: 1px solid var(--line);
  }
  .author-line { display: flex; align-items: flex-start; gap: clamp(14px, 2vw, 26px); }
  .author-name {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(32px, 5vw, 58px);
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.06;
  }
  .author-en {
    margin: 10px 0 0;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seal {
    flex: none;
    width: 46px; height: 46px;
    display: grid;
    place-items: center;
    background: var(--red);
    color: #f7f1e4;
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.05;
    text-align: center;
    margin-top: 8px;
    transform: rotate(-1.4deg);
    box-shadow: 0 0 0 1px rgba(168, 52, 42, .3);
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .seal:hover { transform: rotate(1.2deg) scale(1.04); }
  .seal.in { animation: stamp .8s cubic-bezier(.2,1.45,.3,1) .15s backwards; }
  @keyframes stamp {
    0% { opacity: 0; transform: rotate(-16deg) scale(2.2); }
    58% { opacity: 1; transform: rotate(1.4deg) scale(.94); }
    100% { opacity: 1; transform: rotate(-1.4deg) scale(1); }
  }
  .author-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 11px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tags span {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    padding: 4px 9px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  /* 名录 */
  .list-head {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) 156px 34px;
    gap: 16px;
    padding: 9px 12px 9px 0;
    border-bottom: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #list { position: relative; }

  .rover {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 0;
    background: var(--wash);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    transition: transform .36s cubic-bezier(.2,.8,.2,1), height .3s ease, opacity .22s ease;
  }
  .rover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #d24a36; }

  .row {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) 156px 34px;
    gap: 16px;
    align-items: center;
    width: 100%;
    padding: 20px 12px 20px 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: background .32s ease;
  }
  .row-no {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: color .3s, opacity .3s;
  }
  .row-name {
    position: relative;
    justify-self: start;
    display: inline-block;
    font-family: var(--serif);
    font-size: clamp(22px, 2.7vw, 32px);
    font-weight: 700;
    letter-spacing: .05em;
    line-height: 1.15;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), letter-spacing .35s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  }
  .row-role {
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted);
    transition: color .3s;
  }
  .row-mark {
    font-family: var(--mono);
    font-size: 11px;
    text-align: right;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .3s, transform .3s, color .3s;
  }

  .row:hover .row-no, .row:focus-visible .row-no { color: var(--red); opacity: 1; }
  .row:hover .row-name, .row:focus-visible .row-name { transform: translateX(12px); letter-spacing: .1em; }
  .row:hover .row-role, .row:focus-visible .row-role { color: var(--ink); }
  .row:hover .row-mark, .row:focus-visible .row-mark { opacity: 1; transform: none; color: var(--red); }
  .row:focus-visible { outline: none; }

  .draw::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: var(--paper);
    transform-origin: left;
    transform: scaleX(1);
    transition: transform .75s cubic-bezier(.2,.8,.2,1);
  }
  .draw.in::after { transform: scaleX(0); }

  .fade { opacity: 0; transform: translateY(12px); transition: opacity .75s ease, transform .75s cubic-bezier(.2,.8,.2,1); }
  .fade.in { opacity: 1; transform: none; }

  /* 点击：朱印 + 墨渍 */
  .row-stamp {
    position: absolute;
    right: 16px;
    top: 50%;
    width: 40px; height: 40px;
    margin-top: -20px;
    display: grid;
    place-items: center;
    border: 2px solid var(--red);
    color: var(--red);
    font-family: var(--mono);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    z-index: 3;
    transform: rotate(-12deg) scale(1.8);
  }
  .row.hit .row-stamp { animation: stampIn 1.15s cubic-bezier(.2,1.35,.3,1) forwards; }
  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-18deg) scale(1.9); }
    16% { opacity: 1; transform: rotate(-7deg) scale(.92); }
    26% { transform: rotate(-7deg) scale(1); }
    70% { opacity: 1; transform: rotate(-7deg) scale(1); }
    100% { opacity: 0; transform: rotate(-7deg) scale(1.08); }
  }
  .row.hit .row-name { animation: namePinch .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes namePinch {
    0% { transform: scale(1); }
    35% { transform: translateX(12px) scale(1.06); }
    100% { transform: translateX(12px) scale(1); }
  }
  .blot {
    position: fixed;
    z-index: 35;
    width: 160px; height: 160px;
    margin: -80px 0 0 -80px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(168, 52, 42, .4), rgba(168, 52, 42, .14) 44%, transparent 64%);
    filter: blur(2px);
    mix-blend-mode: multiply;
    border-radius: 48% 52% 46% 54%;
    animation: blot .95s cubic-bezier(.2,.7,.2,1) forwards;
  }
  body.ink-mode .blot { mix-blend-mode: screen; }
  @keyframes blot {
    0% { transform: scale(.12) rotate(0deg); opacity: .95; }
    55% { transform: scale(.85) rotate(14deg); opacity: .5; border-radius: 56% 44% 60% 40%; }
    100% { transform: scale(1.15) rotate(24deg); opacity: 0; }
  }

  /* 行内指针光斑 */
  .row::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(240px circle at var(--mx, 50%) 50%, rgba(168, 52, 42, .08), transparent 66%);
    opacity: 0;
    transition: opacity .45s ease;
  }
  .row:hover::after { opacity: 1; }

  /* 纸 / 墨 切换：旧纸退后、新纸从点击处晕开 */
  ::view-transition-old(root) {
    animation: vtOld .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  ::view-transition-new(root) {
    animation: none;
  }
  @keyframes vtOld {
    to { transform: scale(.982); opacity: .45; filter: blur(1.5px); }
  }

  /* 进度线 */
  .progress {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 1px;
    z-index: 60;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    opacity: .8;
  }

  /* 光标 */
  .cur {
    position: fixed;
    top: 0; left: 0;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    z-index: 55;
    pointer-events: none;
    opacity: 0;
    transition: width .32s cubic-bezier(.2,.8,.2,1), height .32s cubic-bezier(.2,.8,.2,1),
      margin .32s cubic-bezier(.2,.8,.2,1), opacity .3s, border-color .3s;
  }
  .cur.on { opacity: .45; }
  .cur.hot { width: 54px; height: 54px; margin: -27px 0 0 -27px; border-color: var(--red); opacity: .85; }
  .cur-dot {
    position: fixed;
    width: 4px; height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: var(--red);
    z-index: 55;
    pointer-events: none;
  }
  @media (hover: hover) and (pointer: fine) {
    body, .row, .ghost-btn, .theme-btn, .rail a { cursor: none; }
  }

  /* 名字下朱线 */
  .row-name::after {
    content: "";
    position: absolute;
    left: 0; bottom: 2px;
    width: 100%; height: 1px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .row:hover .row-name::after, .row:focus-visible .row-name::after { transform: scaleX(1); }

  /* 点击墨点飞溅 */
  .spray {
    position: fixed;
    z-index: 56;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    pointer-events: none;
    mix-blend-mode: multiply;
    animation: sprayOut .8s cubic-bezier(.2,.7,.2,1) forwards;
  }
  body.ink-mode .spray { mix-blend-mode: screen; }
  @keyframes sprayOut {
    0% { transform: translate(-50%,-50%) scale(1); opacity: .95; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15); opacity: 0; }
  }

  /* 开场分幕 */
  .curtain { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
  .curtain i {
    position: absolute;
    left: 0; right: 0;
    height: 50.2%;
    background: var(--paper);
    display: block;
  }
  .curtain i:first-child { top: 0; animation: curtainUp 1.05s cubic-bezier(.76,0,.24,1) 1.05s forwards; }
  .curtain i:last-child { bottom: 0; animation: curtainDown 1.05s cubic-bezier(.76,0,.24,1) 1.05s forwards; }
  .curtain::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: var(--red);
    opacity: .5;
    animation: curtainLine 1.05s cubic-bezier(.76,0,.24,1) 1.05s forwards;
  }
  @keyframes curtainUp { to { transform: translateY(-101%); } }
  @keyframes curtainDown { to { transform: translateY(101%); } }
  @keyframes curtainLine { to { opacity: 0; } }

  /* 页脚 */
  .colophon {
    margin-top: clamp(52px, 9vh, 104px);
    border-top: 1px solid var(--ink);
    padding: clamp(24px, 4vh, 40px) 0 clamp(38px, 6vh, 68px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    align-items: end;
  }
  .colophon p { margin: 0; max-width: 36ch; font-size: 12.5px; line-height: 2.05; color: var(--ink-soft); }
  .colophon-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost-btn {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink);
    background: none;
    border: 1px solid var(--ink);
    padding: 9px 13px;
    cursor: pointer;
    transition: color .35s ease;
  }
  .ghost-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .42s cubic-bezier(.2,.8,.2,1);
  }
  .ghost-btn:hover { color: var(--paper); }
  .ghost-btn:hover::before { transform: scaleX(1); }

  .imprint {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .imprint i { width: 3px; height: 3px; background: var(--line); }

  @media (max-width: 760px) {
    .masthead { padding: 11px 18px; }
    .mh-kind { display: none; }
    .reg { display: none; }
    .hero-foot { grid-template-columns: 1fr; align-items: start; }
    .author { grid-template-columns: 1fr; align-items: start; }
    .author-meta { align-items: flex-start; }
    .tags { justify-content: flex-start; }
    .list-head { grid-template-columns: 38px minmax(0, 1fr) 30px; }
    .list-head span:nth-child(3) { display: none; }
    .row { grid-template-columns: 38px minmax(0, 1fr) 30px; padding: 16px 8px 16px 0; }
    .row-role { display: none; }
    .row-name { font-size: 23px; }
    .row-mark { opacity: 1; transform: none; }
    .colophon { grid-template-columns: 1fr; align-items: start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    .title .ch { transform: none; }
    .fade { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<canvas id="ink" aria-hidden="true"></canvas>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="cur" id="cur" aria-hidden="true"></div>
<div class="cur-dot" id="curDot" aria-hidden="true"></div>
<div class="curtain" id="curtain" aria-hidden="true"><i></i><i></i></div>

<header class="masthead">
  <div class="mh-left">
    <span class="mh-brand">星叶测试组</span>
    <span class="mh-kind">版权页 / Colophon</span>
  </div>
  <div class="mh-right">
    <span class="mh-sec" id="mhSec">封面</span>
    <span class="mh-page" id="pageNo">00 / 03</span>
    <button class="theme-btn" id="themeBtn" type="button">墨色</button>
  </div>
</header>

<div class="sheet">
  <span class="reg tl"></span><span class="reg tr"></span>
  <span class="reg bl"></span><span class="reg br"></span>

  <div class="grid">
    <nav class="rail" aria-label="章节">
      <div class="rail-inner">
        <a href="#top" class="is-current"><em>00</em>封面</a>
        <a href="#dev"><em>01</em>开发者</a>
        <a href="#team"><em>02</em>测试组</a>
        <a href="#end"><em>03</em>版权</a>
        <span class="rail-tick" id="railTick"></span>
        <span class="rail-line" id="railLine"></span>
      </div>
    </nav>

    <div>
      <section class="hero" id="top">
        <div class="kicker">StarLeaf · Testing Group</div>
        <h1 class="title" id="title">
          <span class="line" data-text="星叶"></span>
          <span class="line" data-text="测试组"></span>
        </h1>
        <div class="hero-foot">
          <div class="hero-stats">
            <div><b data-count="1">0</b>开发者</div>
            <div><b data-count="6">0</b>测试</div>
            <div><b data-count="7">0</b>全员</div>
          </div>
        </div>
      </section>

      <div class="band" aria-hidden="true">
        <div class="band-track" id="bandTrack"></div>
      </div>

      <section class="sec" id="dev">
        <div class="sec-head fade">
          <span class="sec-no">01</span>
          <h2>开发者</h2>
          <span class="en">Author</span>
        </div>
        <div class="author fade">
          <div class="author-line">
            <div>
              <h3 class="author-name">星河一叶Roxy</h3>
              <p class="author-en">StarLeaf · Roxy</p>
            </div>
            <span class="seal" aria-hidden="true">星河<br>一叶</span>
          </div>
          <div class="author-meta">
            <div class="tags"><span>开发</span><span>设计</span><span>程序</span></div>
          </div>
        </div>
      </section>

      <section class="sec" id="team">
        <div class="sec-head fade">
          <span class="sec-no">02</span>
          <h2>测试组</h2>
          <span class="en" id="teamCount">06</span>
        </div>
        <div class="list-head" aria-hidden="true">
          <span>No.</span><span>姓名</span><span>职责</span><span></span>
        </div>
        <div id="list"><span class="rover" id="rover" aria-hidden="true"></span></div>
      </section>

      <footer class="colophon" id="end">
        <p>感谢每一位参与测试、反馈和陪伴的朋友。</p>
        <div class="colophon-actions">
          <button class="ghost-btn" id="toTop" type="button">回到顶部</button>
        </div>
        <div class="imprint">
          <span>星叶测试组</span><i></i>
          <span>2026</span><i></i>
          <span>名录 第一版</span>
        </div>
      </footer>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TESTERS = ['心晴未央', '孙笨', '青晨之城', '墙尼赢手', '花不琢', '甘雨门卫'];
  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 标题逐字 */
  var title = document.getElementById('title');
  [].forEach.call(title.querySelectorAll('.line'), function (line, li) {
    var text = line.getAttribute('data-text');
    line.textContent = '';
    text.split('').forEach(function (ch, i) {
      var el = document.createElement('i');
      el.className = 'ch';
      el.textContent = ch;
      el.style.setProperty('--i', li * 4 + i);
      line.appendChild(el);
    });
  });

  /* 名条 */
  var band = document.getElementById('bandTrack');
  for (var r = 0; r < 2; r++) {
    TESTERS.concat(['星河一叶Roxy']).forEach(function (n) {
      var sp = document.createElement('span');
      sp.textContent = n;
      band.appendChild(sp);
    });
  }

  /* 名录 */
  var list = document.getElementById('list');
  var rows = [];
  TESTERS.forEach(function (name, i) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'row draw fade';
    row.setAttribute('data-name', name);
    row.innerHTML =
      '<span class="row-no">' + pad(i + 1) + '</span>' +
      '<span class="row-name">' + name + '</span>' +
      '<span class="row-role">对局测试 · 问题反馈</span>' +
      '<span class="row-mark">↗</span>' +
      '<span class="row-stamp" aria-hidden="true">' + pad(i + 1) + '</span>';
    list.appendChild(row);
    rows.push(row);
  });
  document.getElementById('teamCount').textContent = pad(TESTERS.length);

  /* 入场 */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });

  var animated = document.querySelectorAll('.fade, .draw, .seal');
  [].forEach.call(animated, function (el, i) {
    el.style.transitionDelay = (i % 9) * 0.04 + 's';
    io.observe(el);
  });

  /* 数字 */
  setTimeout(function () {
    [].forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      var target = parseInt(el.dataset.count, 10);
      var t0 = performance.now();
      (function step(now) {
        var p = Math.min(1, (now - t0) / 1000);
        var v = Math.round(target * (1 - Math.pow(1 - p, 3)));
        el.textContent = pad(v);
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = pad(target);
      })(t0);
    });
  }, 420);

  /* 滑动水痕 */
  var rover = document.getElementById('rover');
  function moveRover(row) {
    if (!row) { rover.style.opacity = '0'; return; }
    rover.style.height = row.offsetHeight + 'px';
    rover.style.transform = 'translateY(' + row.offsetTop + 'px)';
    rover.style.opacity = '1';
  }
  list.addEventListener('pointerover', function (e) {
    moveRover(e.target.closest ? e.target.closest('.row') : null);
  });
  list.addEventListener('focusin', function (e) {
    moveRover(e.target.closest ? e.target.closest('.row') : null);
  });
  list.addEventListener('pointerleave', function () { moveRover(null); });

  list.addEventListener('pointermove', function (e) {
    var row = e.target.closest ? e.target.closest('.row') : null;
    if (!row) return;
    var r = row.getBoundingClientRect();
    row.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
  }, { passive: true });

  /* 点击：盖章 + 墨渍 + 墨点 */
  list.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) return;
    row.classList.remove('hit');
    void row.offsetWidth;
    row.classList.add('hit');
    setTimeout(function () { row.classList.remove('hit'); }, 1200);

    var blot = document.createElement('span');
    blot.className = 'blot';
    blot.style.left = e.clientX + 'px';
    blot.style.top = e.clientY + 'px';
    document.body.appendChild(blot);
    setTimeout(function () { blot.remove(); }, 1000);

    for (var i = 0; i < 14; i++) {
      var a = (Math.PI * 2 * i) / 14 + Math.random() * .5;
      var d = 26 + Math.random() * 76;
      var dot = document.createElement('span');
      dot.className = 'spray';
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      dot.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
      dot.style.setProperty('--dy', (Math.sin(a) * d * .72).toFixed(1) + 'px');
      document.body.appendChild(dot);
      (function (node) { setTimeout(function () { node.remove(); }, 860); })(dot);
    }
  });

  document.getElementById('toTop').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* 章节联动 */
  var railLinks = [].slice.call(document.querySelectorAll('.rail a'));
  var ids = ['top', 'dev', 'team', 'end'];
  var sections = ids.map(function (id) { return document.getElementById(id); });
  var pageNo = document.getElementById('pageNo');
  var mhSec = document.getElementById('mhSec');
  var railTick = document.getElementById('railTick');
  var railLine = document.getElementById('railLine');
  var progress = document.getElementById('progress');
  var SEC_NAMES = ['封面', '开发者', '测试组', '版权'];
  var ticking = false;

  function sync() {
    ticking = false;
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    var prog = Math.min(1, window.scrollY / max);
    if (railLine) railLine.style.transform = 'scaleY(' + prog.toFixed(4) + ')';
    if (progress) progress.style.transform = 'scaleX(' + prog.toFixed(4) + ')';

    var k = Math.min(1, window.scrollY / (window.innerHeight * .85));
    if (title) {
      title.style.letterSpacing = (.01 + k * .05).toFixed(3) + 'em';
      title.style.transform = 'translate3d(0,' + (window.scrollY * .05).toFixed(1) + 'px,0)';
      title.style.opacity = String(Math.max(0, 1 - k * .5));
    }
    var sealEl = document.querySelector('.seal');
    if (sealEl) sealEl.style.translate = '0 ' + (window.scrollY * .02).toFixed(1) + 'px';

    var mid = window.innerHeight * 0.42;
    var current = 0;
    sections.forEach(function (sec, i) {
      if (!sec) return;
      if (sec.getBoundingClientRect().top <= mid) current = i;
    });
    railLinks.forEach(function (a, i) { a.classList.toggle('is-current', i === current); });
    pageNo.textContent = pad(current) + ' / 03';
    var link = railLinks[current];
    if (link && railTick) railTick.style.transform = 'translateY(' + (link.offsetTop + link.offsetHeight / 2) + 'px)';
    if (mhSec && mhSec.textContent !== SEC_NAMES[current]) {
      mhSec.textContent = SEC_NAMES[current];
      mhSec.classList.remove('flip');
      void mhSec.offsetWidth;
      mhSec.classList.add('flip');
    }
  }

  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(sync);
  }, { passive: true });
  sync();

  /* 光标 */
  var cur = document.getElementById('cur');
  var curDot = document.getElementById('curDot');
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    var mx = cx, my = cy;
    window.addEventListener('pointermove', function (e) {
      mx = e.clientX; my = e.clientY;
      curDot.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
      var hot = e.target.closest && e.target.closest('.row, .ghost-btn, .theme-btn, a, .seal');
      cur.classList.add('on');
      cur.classList.toggle('hot', !!hot);
    }, { passive: true });
    (function loop() {
      cx += (mx - cx) * .18;
      cy += (my - cy) * .18;
      cur.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
      requestAnimationFrame(loop);
    })();
  }

  /* 分幕清理 */
  var curtain = document.getElementById('curtain');
  if (curtain) {
    if (reduced) curtain.style.display = 'none';
    else setTimeout(function () { curtain.style.display = 'none'; }, 2300);
  }

  /* 纸 / 墨：从点击处晕开 */
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function (e) {
    var apply = function () {
      var ink = document.body.classList.toggle('ink-mode');
      themeBtn.textContent = ink ? '纸色' : '墨色';
    };
    if (!document.startViewTransition) { apply(); return; }
    var x = e.clientX || window.innerWidth - 60;
    var y = e.clientY || 30;
    var vt = document.startViewTransition(apply);
    vt.ready.then(function () {
      document.documentElement.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + Math.hypot(window.innerWidth, window.innerHeight) + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 760, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' }
      );
    });
  });

  /* 墨迹跟随 + 墨尘 */
  var ink = document.getElementById('ink');
  if (ink && window.matchMedia('(hover: hover) and (pointer: fine)').matches && !reduced) {
    var ictx = ink.getContext('2d');
    var strokes = [];
    var last = null;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var motes = [];

    function size() {
      ink.width = Math.floor(window.innerWidth * dpr);
      ink.height = Math.floor(window.innerHeight * dpr);
      ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener('resize', size);

    for (var m = 0; m < 26; m++) {
      motes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 1 + Math.random() * 2.8,
        vx: (Math.random() - .5) * .18,
        vy: -(.06 + Math.random() * .22),
        a: .07 + Math.random() * .1,
        ph: Math.random() * Math.PI * 2
      });
    }

    window.addEventListener('pointermove', function (e) {
      if (!last) { last = { x: e.clientX, y: e.clientY }; return; }
      var dx = e.clientX - last.x, dy = e.clientY - last.y;
      if (dx * dx + dy * dy < 16) return;
      strokes.push({ x1: last.x, y1: last.y, x2: e.clientX, y2: e.clientY, life: 1, w: 5 + Math.random() * 10 });
      last = { x: e.clientX, y: e.clientY };
      if (strokes.length > 80) strokes.shift();
    }, { passive: true });

    // 墨晕：一滴墨落进水里，慢慢晕开再淡去
    var blooms = [];
    function spawnBloom(red) {
      var min = Math.min(window.innerWidth, window.innerHeight);
      blooms.push({
        x: window.innerWidth * (.08 + Math.random() * .84),
        y: window.innerHeight * (.1 + Math.random() * .8),
        r0: min * (.03 + Math.random() * .05),
        grow: min * (.0009 + Math.random() * .0013),
        life: 0,
        max: 26000 + Math.random() * 16000,
        red: !!red,
        seed: Math.random() * 6.28,
        lobes: 3 + Math.floor(Math.random() * 3)
      });
    }
    for (var bi = 0; bi < 3; bi++) spawnBloom(false);
    var lastPaint = performance.now();
    var spawnT = 0;
    var redT = 0;

    (function paint() {
      ictx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      var tone = document.body.classList.contains('ink-mode') ? '239,231,214' : '24,20,15';
      var dark = document.body.classList.contains('ink-mode');
      var now = performance.now();

      // 底子：极淡暖色，纸面不死平
      var W0 = window.innerWidth, H0 = window.innerHeight;
      var g1 = ictx.createRadialGradient(W0 * .28, H0 * .2, 0, W0 * .28, H0 * .2, Math.max(W0, H0) * .72);
      g1.addColorStop(0, dark ? 'rgba(217,182,118,.05)' : 'rgba(150,116,68,.08)');
      g1.addColorStop(1, 'rgba(150,116,68,0)');
      ictx.fillStyle = g1;
      ictx.fillRect(0, 0, W0, H0);

      var dt = Math.min(80, now - lastPaint);
      lastPaint = now;

      for (var i2 = blooms.length - 1; i2 >= 0; i2--) {
        var b = blooms[i2];
        b.life += dt;
        var pr = b.life / b.max;
        if (pr >= 1) { blooms.splice(i2, 1); continue; }
        var fade = Math.sin(Math.PI * pr);
        var br = b.r0 + b.grow * b.life;
        var btone = b.red ? (dark ? '210,96,79' : '168,52,42') : (dark ? '217,182,118' : '72,55,34');
        var balpha = (b.red ? .05 : .075) * fade * (dark ? .7 : 1);

        for (var l = 0; l < b.lobes; l++) {
          var ang = b.seed + l * 2.1;
          var lx = b.x + Math.cos(ang) * br * .3;
          var ly = b.y + Math.sin(ang) * br * .28;
          var lr = br * (.55 + .2 * Math.sin(b.seed + l));
          var lg = ictx.createRadialGradient(lx, ly, 0, lx, ly, lr);
          lg.addColorStop(0, 'rgba(' + btone + ',' + (balpha / 2).toFixed(3) + ')');
          lg.addColorStop(1, 'rgba(' + btone + ',0)');
          ictx.fillStyle = lg;
          ictx.beginPath();
          ictx.arc(lx, ly, lr, 0, Math.PI * 2);
          ictx.fill();
        }
      }

      spawnT += dt;
      redT += dt;
      if (spawnT > 5200 && blooms.length < 6) { spawnT = 0; spawnBloom(false); }
      if (redT > 16000) { redT = 0; spawnBloom(true); }

      for (var k = 0; k < motes.length; k++) {
        var mo = motes[k];
        mo.x += mo.vx + Math.sin(performance.now() / 2600 + mo.ph) * .14;
        mo.y += mo.vy;
        if (mo.y < -10) { mo.y = window.innerHeight + 10; mo.x = Math.random() * window.innerWidth; }
        if (mo.x < -10) mo.x = window.innerWidth + 10;
        if (mo.x > window.innerWidth + 10) mo.x = -10;
        ictx.beginPath();
        ictx.fillStyle = 'rgba(' + tone + ',' + mo.a.toFixed(3) + ')';
        ictx.arc(mo.x, mo.y, mo.r, 0, Math.PI * 2);
        ictx.fill();
      }

      for (var i = strokes.length - 1; i >= 0; i--) {
        var st = strokes[i];
        st.life -= .013;
        if (st.life <= 0) { strokes.splice(i, 1); continue; }
        ictx.beginPath();
        ictx.lineCap = 'round';
        ictx.lineWidth = st.w * st.life;
        ictx.strokeStyle = 'rgba(' + tone + ',' + (st.life * .07).toFixed(3) + ')';
        ictx.moveTo(st.x1, st.y1);
        ictx.lineTo(st.x2, st.y2);
        ictx.stroke();
      }
      requestAnimationFrame(paint);
    })();
  }
})();
</script>
</body>
</html>
